  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/gazette-theme.css">
</head>
<body>

  <!-- Fixed background video layer -->
  <div class="video-bg">
    <video muted loop playsinline preload="none">
      <source src="../assets/video/bg.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
  </div>

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="container nav-inner">
      <a href="../index.html" class="nav-logo t-heading">
        <img src="../assets/icons/pfp4.png" alt="Logo/go to home" width="50" height="50" >
      </a>
      <div class="nav-pills t-small">
        <a href="../index.html#work">Work</a>
        <a href="./blog.html">Blog</a>
        <a href="./contact.html" class="active">Contact</a>
        <button class="theme-toggle theme-toggle-desktop" aria-label="Toggle theme">
          <span class="theme-toggle-icon"></span>
        </button>
      </div>
      <button class="nav-dropdown-trigger t-small" aria-label="Menu"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      <div class="nav-dropdown-menu">
        <a href="../index.html#work">Work</a>

        <a href="./contact.html">Contact</a>

          <span class="theme-toggle-icon"></span>
          <span class="t-small">Theme</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Contact -->
  <main class="container" style="padding-top:8rem; padding-bottom:4rem;">
    <h1 class="t-display" style="margin-bottom:2rem;">Get in <span class="t-accent">touch</span></h1>
    <p class="t-body" style="color:var(--ink-muted); margin-bottom:2.5rem;">
      Have a project in mind, want to collaborate, or just say hi? Drop a message below.
    </p>

    <form class="contact-form" data-action="submit">
      <div class="field">
        <label for="cf-name" class="t-small">Name</label>
        <input type="text" id="cf-name" name="name" placeholder="Your name" aria-label="Your name" required>
      </div>
      <div class="field">
        <label for="cf-email" class="t-small">Email</label>
        <input type="email" id="cf-email" name="email" placeholder="you@example.com" aria-label="Your email address" required>
      </div>
      <div class="field">
        <label for="cf-msg" class="t-small">Message</label>
        <textarea id="cf-msg" name="message" placeholder="Your message..." aria-label="Your message" required></textarea>
      </div>
      <!-- honeypot -->
      <div class="field hp" aria-hidden="true">
        <label for="cf-hp">Leave blank</label>
        <input type="text" id="cf-hp" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="btn-submit t-small">Send Message</button>
      <p class="form-msg t-small" aria-live="polite"></p>
    </form>

    <!-- Alternative contact methods -->
    <div class="contact-cta" style="margin-top:3rem;">
      <p class="t-body" style="color:var(--ink-muted);margin-bottom:1.5rem;">Or reach out directly:</p>
      <div class="contact-cta-buttons" style="display:flex;gap:1rem;flex-wrap:wrap;">
        <a href="mailto:your.email@example.com" class="btn t-small" style="display:inline-flex;align-items:center;gap:0.5rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          Email
        </a>
        <a href="https://discord.com/users/YOUR_DISCORD_ID" target="_blank" rel="noopener" class="btn t-small" style="display:inline-flex;align-items:center;gap:0.5rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          Discord
        </a>
        <a href="https://github.com/callmejojoe" target="_blank" rel="noopener" class="btn t-small" style="display:inline-flex;align-items:center;gap:0.5rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          GitHub
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy t-small">&copy; 2026 JJ. All rights reserved.</p>
      <div class="footer-links t-small">
        <a href="./terms.html">Terms of Service</a>

    </div>
  </footer>

  <!-- Go to top button -->
  <button class="go-top" aria-label="Scroll to top">↑</button>

    </div>

  <script type="module">
