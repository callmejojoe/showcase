<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Not Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="video-bg fallback"></div>

  <main class="container" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <p class="t-micro" style="margin-bottom:1rem;">404</p>
    <h1 class="t-display">Page not <span class="t-accent">found</span></h1>
    <p class="t-body" style="color:var(--ink-muted);margin:1.5rem 0 2rem;">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn btn-primary t-small" style="padding:0.7rem 1.8rem;border-radius:2px;background:var(--accent);color:var(--paper);text-decoration:none;">
      Back Home
    </a>
  </main>

  <script type="module">
    import { initTheme } from './js/theme.js';
    initTheme();
  </script>
</body>
</html>
